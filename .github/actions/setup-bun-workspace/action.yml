name: Setup Bun workspace
description: >
  Install Bun, restore the install cache, run a frozen-lockfile install, and
  optionally generate the Prisma client. Shared by every CI job so the four
  steps only exist once.

inputs:
  bun-version:
    description: Bun version to install — keep in sync with the Dockerfile.
    required: true
  prisma-generate:
    description: >
      Set "true" to run `bun run --filter server db:generate` after install.
    required: false
    default: "false"
  database-url:
    description: >
      DATABASE_URL for the Prisma generate step. A placeholder connection
      string is fine for jobs that never touch a real database — Prisma
      only needs it to be present, not reachable, to generate the client.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun install cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - name: bun install
      shell: bash
      run: bun install --frozen-lockfile

    - name: Generate Prisma client
      if: inputs.prisma-generate == 'true'
      shell: bash
      run: bun run --filter server db:generate
      env:
        DATABASE_URL: ${{ inputs.database-url }}
