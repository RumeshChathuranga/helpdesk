name: Build, scan, SBOM, sign

on:
  workflow_call:
    inputs:
      push:
        description: >
          Publish to GHCR and sign when true. PRs build and scan only —
          nothing unscanned is ever published, and nothing unpublished is
          ever signed.
        type: boolean
        default: false
    outputs:
      image:
        description: Full image reference that was pushed (empty if push=false)
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: sha256 digest of the pushed image (empty if push=false)
        value: ${{ jobs.build.outputs.digest }}

# Documentation/least-privilege — the calling job must grant at least this
# much, or these steps fail on permissions, not on the build itself.
permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  # Pinned by digest, not tag — a tag can be repointed (see GHSA-69fq-xp46-6x23,
  # 76 of 77 aquasecurity/trivy-action tags force-pushed to malware in 2026-03).
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  # k3d target is x86_64; QEMU-emulated arm64 would multiply an already 1.85 GB build.
  PLATFORMS: linux/amd64
  LOCAL_TAG: helpdesk:ci

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHCR needs a lowercase path but the owner (RumeshChathuranga) isn't —
      # computed once so Cosign and metadata-action can't disagree on case.
      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build local image (for scan + SBOM, never pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.LOCAL_TAG }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # Full report to the Security tab regardless of severity — same
      # report-everything/gate-on-critical pattern as the bun audit job.
      - name: Trivy scan (full report → SARIF)
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/workspace" \
            "$TRIVY_IMAGE" image \
            --format sarif --output /workspace/trivy-results.sarif \
            "$LOCAL_TAG"

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.31.6
        with:
          sarif_file: trivy-results.sarif

      # The gate — same critical-only bar as `bun audit` in ci.yml.
      - name: Trivy scan (gate on CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "$LOCAL_TAG"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.LOCAL_TAG }}
          format: spdx-json
          output-file: helpdesk.spdx.json
          upload-artifact: true

      # Everything above ran against a local, unpushed image.
      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: inputs.push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # Buildx auto-attaches unsigned provenance by default — disabled so
          # Cosign below stays the one signature this pipeline vouches for.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless via Fulcio + Rekor — see devops-docs/setup/going-public.md for
      # why this only runs once the repo is public.
      - name: Sign image (keyless)
        if: inputs.push
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Attest SBOM
        if: inputs.push
        run: |
          cosign attest --yes \
            --predicate helpdesk.spdx.json \
            --type spdxjson \
            "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: "1"
