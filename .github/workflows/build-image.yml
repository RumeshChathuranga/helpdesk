name: Build, scan, SBOM, sign

on:
  workflow_call:
    inputs:
      push:
        description: >
          Publish to GHCR and sign when true. PRs build and scan only —
          nothing unscanned is ever published, and nothing unpublished is
          ever signed.
        type: boolean
        default: false
    outputs:
      image:
        description: Full image reference that was pushed (empty if push=false)
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: sha256 digest of the pushed image (empty if push=false)
        value: ${{ jobs.build.outputs.digest }}

# Requested here for documentation/least-privilege; the calling job must
# grant at least this much, or GITHUB_TOKEN falls back to its default scope
# and cosign/SARIF/GHCR steps fail with a permissions error, not a build
# error — worth knowing before debugging the wrong layer.
permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  # Pinned by digest, not tag — aquasecurity/trivy-action had 76 of 77 tags
  # force-pushed to credential-stealing malware in March 2026
  # (GHSA-69fq-xp46-6x23). Consuming the scanner as a digest-pinned
  # container sidesteps that entire class of compromise: a tag can be
  # repointed, a digest cannot.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  # linux/amd64 only — the k3d target is x86_64, and QEMU-emulated arm64
  # would multiply a build that already produces a 1.85 GB image (see
  # devops-docs/explainers/phase-0-app-readiness.md).
  PLATFORMS: linux/amd64
  LOCAL_TAG: helpdesk:ci

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHCR requires a lowercase path but the repo owner
      # (RumeshChathuranga) is mixed case — docker/metadata-action
      # lowercases internally for its own tags, but Cosign needs the same
      # lowercase ref handed to it explicitly, so it's computed once here
      # and reused everywhere below instead of two things silently
      # disagreeing on case.
      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build local image (for scan + SBOM, never pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.LOCAL_TAG }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # Informational: the full report, uploaded to the Security tab
      # regardless of severity, mirroring the audit job's "report everything,
      # gate on critical" pattern already used for `bun audit`.
      - name: Trivy scan (full report → SARIF)
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/workspace" \
            "$TRIVY_IMAGE" image \
            --format sarif --output /workspace/trivy-results.sarif \
            "$LOCAL_TAG"

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.31.6
        with:
          sarif_file: trivy-results.sarif

      # The gate. Fails the job on any CRITICAL advisory with a known fix —
      # mirrors the `bun audit --audit-level=critical` policy already in
      # ci.yml so the same severity bar applies to code and to the image.
      - name: Trivy scan (gate on CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "$LOCAL_TAG"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.LOCAL_TAG }}
          format: spdx-json
          output-file: helpdesk.spdx.json
          upload-artifact: true

      # Only past this point does anything touch the network as a publish —
      # everything above ran against a local, unpushed image. Login has to
      # happen before the push build, not after.
      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: inputs.push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # Buildx auto-attaches an unsigned provenance attestation by
          # default on push. Disabled deliberately — Cosign below is the
          # one signature this pipeline makes a claim about; a second,
          # unsigned one attached silently would be confusing, not
          # additive. Real SLSA provenance is a deferred, separate piece of
          # work (see the Phase 1 explainer's "still unsolved" section).
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: Fulcio issues a short-lived cert bound to this workflow's
      # OIDC identity, the signature is logged to Sigstore's public Rekor
      # transparency log, and no private key ever exists to lose or rotate.
      # That log entry is why this only runs once the repo is public — see
      # devops-docs/setup/going-public.md.
      - name: Sign image (keyless)
        if: inputs.push
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Attest SBOM
        if: inputs.push
        run: |
          cosign attest --yes \
            --predicate helpdesk.spdx.json \
            --type spdxjson \
            "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: "1"
