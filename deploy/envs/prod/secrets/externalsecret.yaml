# PROD — written in Phase 3, never applied.
#
# Produces exactly the Secret the chart already expects: `existingSecret:
# helpdesk-secrets` in deploy/charts/helpdesk/values.yaml. The app cannot tell
# whether that Secret came from kubeseal on a laptop or from AWS Secrets
# Manager here — keeping existingSecret as the seam is what makes the same
# chart deployable in both places.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helpdesk-secrets
  namespace: helpdesk
spec:
  # Rotating the value in AWS propagates within the hour, with no redeploy.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: helpdesk-secrets
    creationPolicy: Owner
  dataFrom:
    # One JSON secret in AWS whose keys are BETTER_AUTH_SECRET,
    # GITHUB_MODELS_TOKEN, INBOUND_WEBHOOK_SECRET, SMTP_USER, SMTP_PASSWORD and
    # SENTRY_DSN — the same six the dev SealedSecret carries.
    - extract:
        key: helpdesk/prod/app
