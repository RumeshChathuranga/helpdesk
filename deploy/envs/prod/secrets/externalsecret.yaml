# PROD — written in Phase 3, never applied. Produces the same Secret name the
# chart's `existingSecret` expects, so the app can't tell it apart from kubeseal's.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helpdesk-secrets
  namespace: helpdesk
spec:
  # Rotating the value in AWS propagates within the hour, with no redeploy.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: helpdesk-secrets
    creationPolicy: Owner
  dataFrom:
    # One JSON secret in AWS with the same six keys the dev SealedSecret carries.
    - extract:
        key: helpdesk/prod/app
