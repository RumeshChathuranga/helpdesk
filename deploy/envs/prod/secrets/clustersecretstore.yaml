# PROD — written in Phase 3, never applied.
#
# How External Secrets reaches AWS Secrets Manager. There is no access key
# anywhere: the operator's ServiceAccount is annotated with an IAM role ARN by
# the Phase 5 Terraform, EKS projects a signed OIDC token into the pod, and AWS
# exchanges that token for temporary credentials. Same trust model as the
# GitHub OIDC federation in Phase 1 — nothing static to leak.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      # Must match the region the Phase 5 Terraform creates the secret in.
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
