# PROD — written in Phase 3, never applied. How External Secrets reaches AWS
# Secrets Manager — IRSA exchanges a signed OIDC token for credentials, no static key.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      # Must match the region the Phase 5 Terraform creates the secret in.
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
