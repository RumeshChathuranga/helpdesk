# PROD — written in Phase 3, never applied against the Phase 5 EKS cluster.
# Applied by Argo CD — see deploy/argocd/apps/prod/30-helpdesk-db.yaml.

# 3 instances is the smallest count that survives losing one and keeps a quorum.
instances: 3

storage:
  size: 50Gi
  # gp3 over the EKS default gp2: same price band, better baseline IOPS.
  storageClass: gp3

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

postgresql:
  parameters:
    # Two API replicas plus workers plus the migration hook, times the Prisma
    # pool, with headroom for CNPG's own replication connections.
    max_connections: "200"
