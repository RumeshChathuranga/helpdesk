# PROD — written in Phase 3, never applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helpdesk-prod-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: helpdesk
  source:
    repoURL: https://github.com/RumeshChathuranga/helpdesk.git
    targetRevision: master
    path: deploy/charts/helpdesk
    helm:
      # CI never writes either of these. The tag moves only when a promotion
      # pull request is merged.
      valueFiles:
        - /deploy/envs/prod/values.yaml
        - /deploy/envs/prod/image-tag.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: helpdesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
