# PROD — written in Phase 3, never applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Wave 0 — the operator and its CRDs must exist before the
    # ClusterSecretStore and ExternalSecret in wave 20.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: helpdesk
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.8.0
    helm:
      valuesObject:
        serviceAccount:
          # The IRSA annotation is added by the Phase 5 Terraform rather than
          # committed here, because it embeds the AWS account ID.
          name: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's CRDs are past the client-side apply annotation limit.
      - ServerSideApply=true
