# PROD — written in Phase 4, never applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: helpdesk
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    # Alloy, not Promtail — the Promtail chart is deprecated upstream.
    # Same job here: tail every pod log on the node and ship it to Loki.
    targetRevision: 1.11.1
    helm:
      valuesObject:
        # DaemonSet, because log files live on the node's filesystem and each
        # agent should only ever read its own node's.
        controller:
          type: daemonset
        crds:
          create: false
        alloy:
          mounts:
            varlog: true
          clustering:
            enabled: false
          # HOSTNAME inside a DaemonSet pod is the pod name, not the node name,
          # so the node-scoped discovery selector below needs this explicitly.
          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 256Mi
          configMap:
            content: |-
              discovery.kubernetes "pods" {
                role = "pod"

                // Only this node's pods — without the selector every agent in
                // the DaemonSet lists the whole cluster and discards most of it.
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("NODE_NAME")
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                // api vs worker — the same label the PodMonitor puts on metrics,
                // so a Grafana panel can move between the two with one variable.
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
                  target_label  = "component"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  action        = "replace"
                  replacement   = "/var/log/pods/*$1/*.log"
                  target_label  = "__path__"
                }
              }

              local.file_match "pod_logs" {
                path_targets = discovery.relabel.pod_logs.output
              }

              loki.source.file "pod_logs" {
                targets    = local.file_match.pod_logs.targets
                forward_to = [loki.process.pod_logs.receiver]
              }

              loki.process "pod_logs" {
                // containerd writes "<ts> <stream> <flags> <line>"; this unwraps
                // it so the JSON below sees the application's own output.
                stage.cri {}

                // Scoped to the app namespace — Postgres and the operators
                // don't log JSON, so parsing their output would just add noise.
                stage.match {
                  selector = "{namespace=\"helpdesk\"}"

                  stage.json {
                    expressions = { level = "level", subsystem = "component" }
                  }

                  // pino's `component` becomes `subsystem` so it cannot collide
                  // with the api/worker `component` label set above.
                  stage.labels {
                    values = { level = "", subsystem = "" }
                  }
                }

                forward_to = [loki.write.loki.receiver]
              }

              loki.write "loki" {
                endpoint {
                  url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
