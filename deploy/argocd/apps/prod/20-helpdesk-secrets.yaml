# PROD — written in Phase 3, never applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helpdesk-secrets-prod
  namespace: argocd
  annotations:
    # Wave 20 — same reason as dev: the migration hook mounts this Secret.
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: helpdesk
  source:
    repoURL: https://github.com/RumeshChathuranga/helpdesk.git
    targetRevision: master
    path: deploy/envs/prod/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: helpdesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
