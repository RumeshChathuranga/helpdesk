apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helpdesk-secrets-dev
  namespace: argocd
  annotations:
    # Wave 20 — the app's migration hook mounts this Secret with envFrom, so a
    # pod would sit in CreateContainerConfigError if it landed later.
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: helpdesk
  source:
    repoURL: https://github.com/RumeshChathuranga/helpdesk.git
    targetRevision: master
    path: deploy/envs/dev/secrets
    directory:
      # Only sealed files — the README in that directory is documentation, not
      # a manifest, and an empty match set syncs cleanly before the first seal.
      include: "*.sealed.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: helpdesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
