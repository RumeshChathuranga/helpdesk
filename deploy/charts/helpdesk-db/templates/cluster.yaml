apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.image }}

  bootstrap:
    initdb:
      database: {{ .Values.bootstrap.database }}
      owner: {{ .Values.bootstrap.owner }}
      # Runs as superuser — the CNPG-created owner role isn't one, so the app's
      # own CREATE EXTENSION migration would otherwise fail.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector

  postgresql:
    parameters:
      {{- toYaml .Values.postgresql.parameters | nindent 6 }}

  enableSuperuserAccess: {{ .Values.enableSuperuserAccess }}

  storage:
    size: {{ .Values.storage.size }}
    {{- with .Values.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}

  resources:
    {{- toYaml .Values.resources | nindent 4 }}
