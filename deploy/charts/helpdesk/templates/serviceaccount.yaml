{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helpdesk.serviceAccountName" . }}
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
# The app never calls the Kubernetes API, so it has no business carrying a
# mounted token an attacker could reuse.
automountServiceAccountToken: false
{{- end }}
