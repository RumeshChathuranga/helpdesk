{{- if and .Values.metrics.enabled .Values.metrics.podMonitor.enabled }}
# A PodMonitor rather than a ServiceMonitor: the worker has no Service (nothing
# routes traffic to it), and inventing one purely to be scraped would be a
# Service that misrepresents what exists. This selects pods directly, so api and
# worker are covered by one object.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "helpdesk.fullname" . }}
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    {{- with .Values.metrics.podMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "helpdesk.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.podMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.podMonitor.scrapeTimeout }}
      relabelings:
        # Without this every series from both deployments is indistinguishable
        # except by pod name, so "API error rate" would silently include the
        # worker. The component label is what the alerts below split on.
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
          targetLabel: component
          action: replace
{{- end }}
