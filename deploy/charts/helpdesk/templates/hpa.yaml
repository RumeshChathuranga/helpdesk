{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "helpdesk.fullname" . }}-api
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # API only — the worker's real scaling signal is pg-boss queue depth, not
  # CPU, since a worker blocked on the AI provider is idle but backlogged.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "helpdesk.fullname" . }}-api
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
