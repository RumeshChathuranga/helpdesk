{{- if and .Values.metrics.enabled .Values.metrics.dashboard.enabled }}
# Ships with the app, not the monitoring stack — it draws metric names this
# chart's pods emit, so both must change in the same commit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helpdesk.fullname" . }}-dashboard
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    {{ .Values.metrics.dashboard.label }}: "1"
data:
  helpdesk-pipeline.json: |-
    {{- .Files.Get "dashboards/helpdesk-pipeline.json" | nindent 4 }}
{{- end }}
