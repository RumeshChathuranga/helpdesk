# Local-only Jenkins fluency demo. GitHub Actions (../.github/workflows/)
services:
  jenkins:
    build: .
    ports:
      - "8090:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the host's docker group id}"

volumes:
  jenkins_home:
